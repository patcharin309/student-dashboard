<!DOCTYPE html>
<html lang="th">
<head>

    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header Navigation -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-3xl text-yellow-300"></i>
                <div>
                    <h1 class="text-xl font-bold">ระบบติดตามการส่งงานนักเรียน</h1>
                    <p class="text-xs text-indigo-200" id="school-name-display">โรงเรียนยุวพุทธิศึกษาอุปถัมภ์</p>
                </div>
            </div>
            
            <!-- Navigation Role Tabs -->
            <div class="flex bg-indigo-800 p-1 rounded-xl">
                <button onclick="switchRole('student')" id="tab-student" class="px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 bg-white text-indigo-900 shadow">
                    <i class="fa-solid fa-user-graduate"></i> นักเรียน
                </button>
                <button onclick="switchRole('teacher')" id="tab-teacher" class="px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 text-indigo-200 hover:text-white">
                    <i class="fa-solid fa-chalkboard-user"></i> ครูผู้สอน
                </button>
                <button onclick="checkAdminAccess()" id="tab-admin" class="px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 text-indigo-200 hover:text-white">
                    <i class="fa-solid fa-user-gear"></i> แอดมิน
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- ================= STUDENT VIEW ================= -->
        <section id="view-student" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center max-w-xl mx-auto">
                <h2 class="text-2xl font-bold text-slate-800 mb-2">ตรวจสอบสถานะการส่งงาน</h2>
                <p class="text-slate-500 mb-6 text-sm">กรอกรหัสประจำตัวนักเรียนเพื่อดูภาระงานและคะแนนของคุณ</p>
                
                <div class="flex gap-2">
                    <input type="text" id="student-search-id" placeholder="พิมพ์รหัสประจำตัว เช่น 1001" class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg font-semibold">
                    <button onclick="searchStudentWork()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium shadow transition">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i> ค้นหา
                    </button>
                </div>
            </div>
